[versions]
compileSdkVersion = "36"
minSdkVersion = "24"
targetSdkVersion = "36"

agp = "8.13.1"
kotlin = "2.2.21"
coreKtx = "1.17.0"
annotation = "1.9.1"
palette = "1.0.0"
browser = "1.9.0"
preference = "1.2.1"
swiperefreshlayout = "1.1.0"
work_runtime = "2.11.0"
datastore_preferences = "1.1.7"

material = "1.13.0"
firebase = "23.0.0"
guava = "33.5.0-android"
gson = "2.13.2"
google_services = "4.4.4"

robolectric = "4.16"
junit = "4.13.2"

common = "0.2.1"

kotlinx_coroutines = "1.7.3"
joda_time = "2.13.1"
glide = "5.0.5"
retrofit = "3.0.0"
okhttp = "5.3.0"
rxjava = "3.1.12"
rxandroid = "3.0.2"
rxlifecycle = "4.0.2"
