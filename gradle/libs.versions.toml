rootbeer = "0.1.0"
fab = "1.6.4"
app_intro = "6.3.1"
subsampling_scale_image_view = "3.10.0"
sentry_gradle = "5.12.2"
sentry_android_core = "8.25.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
androidx-palette = { group = "androidx.palette", name = "palette", version.ref = "palette" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
androidx-preference = { group = "androidx.preference", name = "preference", version.ref = "preference" }
androidx-swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefreshlayout" }
androidx-work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "work_runtime" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore_preferences" }
androidx-datastore-preferences-rxjava3 = { group = "androidx.datastore", name = "datastore-preferences-rxjava3", version.ref = "datastore_preferences" }
