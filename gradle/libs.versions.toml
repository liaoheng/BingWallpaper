native-stack-blur = { group = "com.github.Commit451", name = "NativeStackBlur", version.ref = "native_stack_blur" }
rootbeer = { group = "com.github.scottyab", name = "rootbeer", version.ref = "rootbeer" }
fab = { group = "com.github.clans", name = "fab", version.ref = "fab" }
app-intro = { group = "com.github.AppIntro", name = "AppIntro", version.ref = "app_intro" }
subsampling-scale-image-view = { group = "com.davemorrissey.labs", name = "subsampling-scale-image-view-androidx", version.ref = "subsampling_scale_image_view" }
sentry-android-core = { group = "io.sentry", name = "sentry-android-core", version.ref = "sentry_android_core" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "google_services" }
sentry-gradle = { id = "io.sentry.android.gradle", version.ref = "sentry_gradle" }
