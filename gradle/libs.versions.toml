#test
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
junit = { group = "junit", name = "junit", version.ref = "junit" }


common-core = { group = "com.github.liaoheng", name = "common-core", version.ref = "common" }
common-adapter = { group = "com.github.liaoheng", name = "common-adapter", version.ref = "common" }

#third party
kotlinx-coroutines-rx3 = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-rx3", version.ref = "kotlinx_coroutines" }
joda-time = { group = "joda-time", name = "joda-time", version.ref = "joda_time" }
